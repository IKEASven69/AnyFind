[workspace]
resolver = "2"
members = ["anyfind-core", "anyfindd", "bench-engine"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
walkdir = "2"
chrono = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
