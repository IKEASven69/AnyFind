# dsh-anyfind bundle patch：把统一搜索插件插入 profile 合成。
# host 半：/dsh-anyfind/api/* 内核代理路由 + anyfind_search 工具 + /anyfind 斜杠命令；
# 浏览器半由 package.json 的 dsh.client 声明 + exports["./client"] 提供。
# 默认读取 %APPDATA%/anyfind/config.json，自动跟随桌面端分配的内核端口。
# config.endpoint 仅保留给开发或远程部署时显式覆盖。

- insert:
    - id: anyfind
      name: 'dsh-anyfind'
